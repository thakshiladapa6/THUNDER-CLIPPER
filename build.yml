name: Build THUNDER CLIPPER exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffx
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item (Get-ChildItem ffx -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName bin\
          Copy-Item (Get-ChildItem ffx -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName bin\

      - name: Generate logo
        run: python make_logo.py

      - name: Build exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name THUNDER_CLIPPER --icon assets/icon.ico `
            --add-data "assets;assets" --add-binary "bin/ffmpeg.exe;bin" --add-binary "bin/ffprobe.exe;bin" `
            --collect-all customtkinter --collect-all yt_dlp --collect-all chat_downloader `
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all tokenizers --collect-all av app.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: THUNDER_CLIPPER_exe
          path: dist/THUNDER_CLIPPER.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/THUNDER_CLIPPER.exe
